<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090c"><title>黒天終焔 — 終末の詠唱</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="fire" aria-hidden="true"></canvas><canvas id="sigils" aria-hidden="true"></canvas><div class="grain"></div>
<header><a href="./" class="brand">黒天終焔<span>THE LAST LITURGY</span></a><button id="sound" aria-pressed="false">音響 OFF</button></header>
<main><div class="eyebrow">二十節の禁忌 ／ 炎のタイピング</div><h1>光をも、<br>焼き尽くせ。</h1><p class="intro">言葉を結べ。積み上げた力を、解き放て。</p><div class="stage-view"><span id="stageMark">STAGE 01 / 20</span><span id="stageName">真紅を纏う者</span><span id="stageClear" aria-live="polite"></span></div>
<section id="game" aria-label="詠唱ゲーム"><div class="hud"><span id="chapter">第一節 <small>/ 二十節</small></span><span id="phase">壱 · 紅蓮</span><span id="clock">待機中</span></div><div class="time"><i id="bar"></i></div><div id="seals" aria-label="二十節の進行"></div>
<div id="verse" class="verse"></div><div id="reading"></div><div id="roman" aria-label="入力するローマ字"></div>
<div id="startArea"><button id="start" class="primary">封印を解き、詠唱する <span>↵</span></button><p>半角英字で入力・空白と句読点は不要<br>各節で時間がリセット。誤入力か時間切れで魔法発動。</p></div>
<div id="playArea" hidden><label for="capture" id="inputLabel">この欄を選択して詠唱 · 日本語入力をOFFに</label><input id="capture" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ローマ字の詠唱入力"><p id="notice">一節ずつ、確かに。</p></div>
<div id="result" hidden aria-live="polite"><p id="reason"></p><h2 id="spell"></h2><p id="resultText"></p><button id="retry" class="primary">再び、第一節から <span>↵</span></button></div></section>
<footer><span>赤 — 青 — 白 — 黒</span><span>一節が一つのステージ。終わりは、魔法の始まり。</span><button id="motion" aria-pressed="false">演出を控えめに</button></footer></main><div id="release" hidden aria-live="polite"><p id="releaseMark">魔法発動</p><h2 id="releaseName"></h2><p id="releaseQuote"></p></div><script src="game.js"></script><script src="effect.js"></script><script src="ritual.js"></script></body></html>
